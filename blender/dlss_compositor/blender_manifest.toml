schema_version = "1.0.0"

id = "dlss_compositor"
version = "2.0.0"
name = "DLSS Compositor"
tagline = "DLSS SR+FG offline batch rendering pipeline"
maintainer = "DLSS Compositor Contributors"
type = "add-on"
blender_version_min = "5.1.0"
license = ["SPDX:MIT"]
platforms = ["windows-x64"]

# Third-party Python dependencies (bundled as wheels)
# Must be declared before any [section] headers in TOML
wheels = [
  "./wheels/jsonschema-4.26.0-py3-none-any.whl",
  "./wheels/attrs-26.1.0-py3-none-any.whl",
  "./wheels/jsonschema_specifications-2025.9.1-py3-none-any.whl",
  "./wheels/referencing-0.37.0-py3-none-any.whl",
  "./wheels/rpds_py-2026.5.1-cp312-cp312-win_amd64.whl",
]

[permissions]
files = "Write per-frame camera data and dlssconfig.json to output directory"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
  "*.pyc",
  "tests/",
]
