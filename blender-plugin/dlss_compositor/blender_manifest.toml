schema_version = "1.0.0"

id = "dlss_compositor"
version = "1.0.0"
name = "DLSS Compositor"
tagline = "DLSS SR+FG offline batch rendering pipeline"
maintainer = "DLSS Compositor Contributors"
type = "add-on"
blender_version_min = "5.1.0"
license = ["SPDX:MIT"]
platforms = ["windows-x64"]

[permissions]
files = "Write per-frame camera data and dlssconfig.json to output directory"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
  "*.pyc",
  "tests/",
]
